force_eco:
  name: Force Eco Mode
  description: Force the system into eco mode
  fields:
    enable:
      name: Enable
      description: Enable or disable force eco mode
      required: false
      default: true
      selector:
        boolean:

force_comfort:
  name: Force Comfort Mode
  description: Force the system into comfort mode
  fields:
    enable:
      name: Enable
      description: Enable or disable force comfort mode
      required: false
      default: true
      selector:
        boolean:

reset_temperatures:
  name: Reset Temperatures
  description: Reset all temperature settings to defaults


trigger_ventilation:
  name: Trigger Ventilation
  description: Start a ventilation cycle now
  fields:
    duration:
      name: Duration
      description: How long to run, in minutes. Defaults to the configured run duration.
      required: false
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min
